# Pinned third-party actions (full commit SHA):
#   actions/checkout@v4.2.2           → 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-java@v4.7.0         → 3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
#   actions/upload-artifact@v4.6.2    → ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4.1.9  → cc203385981b70ca67e1cc392babf9cc229d5806
#   softprops/action-gh-release@v2.2.1 → c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda

name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "ci-dryrun/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for packaging dry run (e.g. 1.0.0 or v1.0.0-rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: Crewcast-macos-arm64
            ext: dmg
            script: packaging/build-macos.sh
          # Intel/x64 macOS — GitHub may rename or retire this runner label.
          - os: macos-15-intel
            artifact: Crewcast-macos-x64
            ext: dmg
            script: packaging/build-macos.sh
          - os: windows-latest
            artifact: Crewcast-windows-x64
            ext: msi
            script: packaging/build-windows.ps1
          # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
          - os: ubuntu-24.04
            artifact: Crewcast-linux-x64
            ext: deb
            script: packaging/build-linux.sh

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set release version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "CREWCAST_RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "CREWCAST_RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x packaging/build-macos.sh packaging/build-linux.sh packaging/generate-artwork.sh
          ./${{ matrix.script }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          find dist -mindepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) -exec mv -t dist {} +
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(Crewcast-*.*)
          if (( ${#files[@]} == 0 )); then
            echo "No installer files found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Crewcast-macos-arm64.dmg
            dist/Crewcast-macos-x64.dmg
            dist/Crewcast-windows-x64.msi
            dist/Crewcast-linux-x64.deb
            dist/SHA256SUMS.txt
