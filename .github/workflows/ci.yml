# Pinned third-party actions (full commit SHA):
#   actions/checkout@v4.2.2     → 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-java@v4.7.0   → 3a4f6e1af504cf6a31855fa899c6aa5355ba6c12

name: CI

on:
  pull_request:
    branches:
      - main
      - "dev/**"
      - "release/**"
  push:
    branches:
      - main
      - "dev/**"
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GitHub runners have no ffmpeg/Playwright; e2e tests need both locally before release.
      - name: Verify
        run: mvn -B verify -DexcludedGroups=e2e
