<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crewcast settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!-- Static mockup: system fonts only (production desktop app bundles Manrope + JetBrains Mono locally). -->
<style>
body{margin:0}
</style>
</helmet>
<div style="width:700px;height:760px;box-sizing:border-box;padding:40px;background:linear-gradient(135deg,#dfe4ee,#c3ccdc);display:flex;font-family:system-ui,sans-serif">
<div style="width:620px;height:680px;background:#14171c;border-radius:12px;box-shadow:0 28px 64px rgba(10,14,24,.38),0 0 0 1px rgba(255,255,255,.07);overflow:hidden;display:flex;flex-direction:column;color:#e8ebf0">

<div style="height:44px;flex:none;background:#1a1e25;border-bottom:1px solid #262b34;display:flex;align-items:center;padding:0 16px;gap:16px">
<div aria-hidden="true" style="display:flex;gap:8px;width:80px">
<span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span>
<span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span>
<span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span>
</div>
<div style="flex:1;text-align:center;font-size:13px;font-weight:700;letter-spacing:.2px;color:#c9d0db">Settings</div>
<div style="width:80px"></div>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:6px 24px 16px;display:flex;flex-direction:column;overflow:hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div>
<sc-if value="{{r.isHeading}}" hint-placeholder-val="{{false}}">
<div style="font-size:11px;font-weight:700;letter-spacing:.8px;color:#8b94a3;text-transform:uppercase;padding:18px 0 6px">{{r.title}}</div>
</sc-if>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{true}}">
<div style="display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid #20252d">
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:600">{{r.label}}</div>
<div style="font-size:12px;color:#8b94a3;margin-top:2px;line-height:1.4">{{r.desc}}</div>
</div>
<button aria-pressed="{{r.on}}" aria-label="{{r.label}}" style="width:38px;height:22px;flex:none;border-radius:11px;border:0;padding:2px;background:{{r.toggleBg}};display:flex;justify-content:{{r.toggleAlign}};cursor:pointer"><span style="width:18px;height:18px;border-radius:9px;background:#ffffff"></span></button>
</div>
</sc-if>
<sc-if value="{{r.isChoice}}" hint-placeholder-val="{{false}}">
<div style="display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid #20252d">
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:600">{{r.label}}</div>
<div style="font-size:12px;color:#8b94a3;margin-top:2px;line-height:1.4">{{r.desc}}</div>
</div>
<button style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 12px;border-radius:8px;border:1px solid #2f3541;background:#1f242c;color:#e8ebf0;font:600 12.5px system-ui,sans-serif;cursor:pointer">{{r.value}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #262b34;background:#1a1e25">
<button style="height:34px;padding:0 16px;border-radius:9px;border:1px solid #2f3541;background:#1f242c;color:#e8ebf0;font:700 12.5px system-ui,sans-serif;cursor:pointer">Cancel</button>
<button style="height:34px;padding:0 18px;border-radius:9px;border:0;background:{{accent}};color:#0b1020;font:700 12.5px system-ui,sans-serif;cursor:pointer">Done</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5b8cff","options":["#5b8cff","#8b7bff","#2dd4bf","#f59e0b"]},"$preview":{"width":700,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#5b8cff';
    const toggle = (label, desc, on) => ({
      isToggle: true, isHeading: false, isChoice: false, label, desc, on,
      toggleBg: on ? accent : '#3a404b',
      toggleAlign: on ? 'flex-end' : 'flex-start'
    });
    const choice = (label, desc, value) => ({ isChoice: true, isHeading: false, isToggle: false, label, desc, value });
    const heading = (title) => ({ isHeading: true, isToggle: false, isChoice: false, title });
    return {
      accent,
      rows: [
        heading('Sharing'),
        toggle('Require private key in links', 'Adds ?t= to every link so guessed addresses show nothing', true),
        toggle('Allow same‑Wi‑Fi access', 'Lets devices on your network connect directly', true),
        choice('Server port', 'Picked automatically each launch', 'Auto'),
        heading('Tunnel'),
        choice('Public link provider', 'Cloudflare quick tunnel needs no account', 'Cloudflare'),
        choice('Connection type', 'Switch to HTTP/2 if streaming keeps dropping', 'Automatic'),
        toggle('Start tunnel when sharing starts', 'Turn off for Wi‑Fi‑only sharing', true),
        heading('Playback'),
        toggle('Fix audio for browsers', 'Converts AC3 / DTS to AAC on the fly; uses ffmpeg', true),
        choice('Preferred audio language', 'Used when a file has several audio tracks', 'Malayalam'),
        choice('Chapter thumbnails', 'How many frames the jump grid shows', '20'),
        heading('This computer'),
        toggle('Keep computer awake while sharing', 'Stops sleep from cutting off viewers', true),
        toggle('Open Crewcast at login', 'Starts the app, never starts sharing by itself', false)
      ]
    };
  }
}
</script>
</body>
</html>
