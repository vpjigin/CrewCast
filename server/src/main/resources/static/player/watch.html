<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Video</title>
<link rel="stylesheet" href="/player/player.css">
</head>
<body>
<div id="player">
  <video id="video" src="" playsinline preload="metadata"></video>
  <div id="tap-zone"></div>
  <div id="center-icon" aria-hidden="true">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </div>
  <div id="video-error" class="notice error-notice" hidden></div>
  <div id="hevc-notice" class="notice" hidden></div>
  <div id="audio-picker-overlay" hidden>
    <div id="audio-picker-panel">
      <h2 id="audio-picker-title">Choose audio language</h2>
      <div id="audio-picker-list"></div>
    </div>
  </div>
  <div id="audio-prep-overlay" hidden>
    <p id="audio-prep-text">Preparing audio for your browser…</p>
    <button id="audio-prep-cancel" class="ctrl prep-cancel" type="button" hidden>Continue with current track</button>
  </div>
  <div id="top-bar">
    <select id="audio-select" class="ctrl" aria-label="Audio track" hidden></select>
    <select id="captions-select" class="ctrl" aria-label="Captions" hidden>
      <option value="off">Captions</option>
    </select>
    <span id="captions-notice" class="captions-notice" hidden></span>
    <select id="speed-select" class="ctrl" aria-label="Playback speed">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <button id="btn-chapters" class="ctrl" type="button" aria-label="Chapters" title="Chapters">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
      <span>Chapters</span>
    </button>
    <button id="btn-fullscreen" class="ctrl" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
  <div id="bottom-bar">
    <div id="seek-wrap">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    </div>
    <div id="controls-row">
      <span id="time">0:00 / 0:00</span>
      <button id="btn-back" class="ctrl" type="button" aria-label="Back 10 seconds">-10</button>
      <button id="btn-play" class="ctrl" type="button" aria-label="Play">
        <svg id="btn-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="btn-pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-forward" class="ctrl" type="button" aria-label="Forward 10 seconds">+10</button>
      <button id="btn-mute" class="ctrl" type="button" aria-label="Mute">
        <svg id="icon-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg id="icon-muted" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <span id="spacer"></span>
    </div>
  </div>
</div>
<div id="chapter-overlay" aria-hidden="true">
  <div id="chapter-header">
    <h2>Chapters</h2>
    <button id="btn-chapter-close" class="ctrl" type="button" aria-label="Close chapters">&times;</button>
  </div>
  <div id="chapter-grid"></div>
</div>
<video id="thumb-video" src="" muted playsinline preload="auto"></video>
<canvas id="thumb-canvas"></canvas>
</body>
<script src="/player/player-audio.js"></script>
<script src="/player/player-subtitles.js"></script>
<script src="/player/player.js"></script>
</body>
</html>
