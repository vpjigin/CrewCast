<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#06201D"></path></svg>
    </div>
    <div class="brand-name">Crewcast</div>
  </div>
  <div id="header-count" class="header-count" aria-live="polite"></div>
</header>

<main class="main">
  <div class="hero">
    <div class="hero-head">
      <div class="hero-text">
        <div class="hero-kicker">Shared folder</div>
        <h1 id="share-title">Shared files</h1>
      </div>
      <a class="btn btn-outline btn-download-all" id="btn-download-all" href="#" hidden
         aria-label="Download all files in this folder as a zip">Download all</a>
    </div>
    <p class="hero-lead">Tap any file to open it. Photos and videos can be viewed here; everything else can be downloaded.</p>
  </div>
  <nav id="browse-nav" class="browse-nav" hidden aria-label="Folder location">
    <button type="button" class="btn-back" id="btn-back" hidden>Back</button>
    <ol id="breadcrumb" class="breadcrumb"></ol>
  </nav>
  <div id="file-grid" class="file-grid" role="list"></div>
  <button type="button" class="btn btn-secondary show-more" id="btn-show-more" hidden>Show more</button>
  <p id="status-message" class="empty-state" hidden></p>
</main>

<div id="modal" class="modal-root" hidden>
  <button type="button" class="modal-backdrop" id="modal-backdrop" aria-label="Close popup"></button>
  <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="modal-titles">
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-sub" class="modal-sub"></div>
      </div>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div id="modal-preview" class="modal-body" hidden>
      <div class="preview-frame" id="preview-frame"></div>
    </div>
    <div id="modal-no-preview" class="no-preview" hidden>
      <div class="no-preview-icon" id="no-preview-ext"></div>
      <div class="no-preview-text">
        <h2>No preview for this file type</h2>
        <p>Download it to open it on your device.</p>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="btn-view" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span id="btn-view-label">View</span>
      </button>
      <a class="btn btn-primary" id="btn-download" download href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"></path></svg>
        Download
      </a>
    </div>
  </div>
</div>

<div id="image-viewer" class="image-viewer" hidden>
  <div class="image-viewer-bar">
    <div id="image-viewer-title" class="image-viewer-title"></div>
    <div class="image-viewer-actions">
      <a class="btn btn-outline image-viewer-download" id="image-viewer-download" download href="#">Download</a>
      <button type="button" class="image-viewer-close" id="image-viewer-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  </div>
  <button type="button" class="image-nav image-nav-prev" id="image-nav-prev" aria-label="Previous image" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
  </button>
  <button type="button" class="image-nav image-nav-next" id="image-nav-next" aria-label="Next image" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </button>
  <div class="image-viewer-stage" id="image-viewer-stage">
    <img id="image-viewer-img" alt="" src="">
  </div>
</div>

<script src="/index.js"></script>
</body>
</html>
